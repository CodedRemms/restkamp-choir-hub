<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RESTKAMP Choir</title>
<meta name="description" content="Songs, schedules, rules and announcements for the RESTKAMP Choir.">
<meta property="og:title" content="RESTKAMP Choir">
<meta property="og:description" content="Songs, schedules, rules and announcements for the RESTKAMP Choir.">
<meta name="theme-color" content="#5a1229">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky app bar + icon tab strip at the top; a landing hero with section tiles; section pages open under the same bar with a large Back button */
:root{
  --wine:#5a1229; --wine2:#9c2a52; --gold:#e3b04b; --gold-ink:#2b1a00;
  --bg:#f6f1f4; --card:#ffffff; --ink:#1f141c; --mut:#6d5c68; --line:#eadde5; --soft:#f6e6ee;
  --ok:#1f8a4c; --bad:#c23b3b; --shadow:0 1px 2px rgba(60,10,30,.06),0 8px 24px rgba(60,10,30,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#110b10; --card:#1c1419; --ink:#f6eef3; --mut:#b6a3b0; --line:#33252e; --soft:#2e1a24;
  --ok:#4cc27f; --bad:#ef7a7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
a{color:var(--wine2);font-weight:600}
@media (prefers-color-scheme:dark){a{color:var(--gold)}}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#8f2048 0%,#5a1229 45%,#2a0714 100%);color:#fff;transition:opacity .6s ease,transform .7s cubic-bezier(.7,0,.3,1)}
#splash.go{opacity:0;transform:translateY(-6%);pointer-events:none}
.sp-in{display:grid;justify-items:center;gap:18px;text-align:center}
.eq{display:flex;gap:7px;align-items:flex-end;height:64px}
.eq i{width:9px;border-radius:9px;background:linear-gradient(#ffe39a,var(--gold));animation:eq 1s ease-in-out infinite;transform-origin:bottom}
.eq i:nth-child(1){height:30%;animation-delay:-.2s}.eq i:nth-child(2){height:70%;animation-delay:-.5s}.eq i:nth-child(3){height:100%;animation-delay:-.1s}
.eq i:nth-child(4){height:55%;animation-delay:-.7s}.eq i:nth-child(5){height:85%;animation-delay:-.3s}.eq i:nth-child(6){height:40%;animation-delay:-.6s}.eq i:nth-child(7){height:65%;animation-delay:-.4s}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.sp-word{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,72px);letter-spacing:.04em;line-height:1;display:flex}
.sp-word span{display:inline-block;opacity:0;transform:translateY(40%) rotate(6deg);animation:rise .6s cubic-bezier(.2,.9,.2,1.2) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sp-sub{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);opacity:0;animation:fade .6s .9s forwards}
@keyframes fade{to{opacity:1}}
.sp-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,230,160,.35) 50%,transparent 60%);background-size:250% 100%;animation:shine 1.6s .5s ease-in-out forwards;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-60% 0}}
.flash{position:fixed;inset:0;z-index:99;background:#fff6dc;pointer-events:none;animation:flash .7s ease-out forwards}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}

/* ---------- App bar + tabs ---------- */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);text-decoration:none}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--wine2),var(--wine));display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(90,18,41,.35)}
.logo svg{width:22px;height:22px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 12px;border-radius:999px;border:0;background:var(--wine);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(90,18,41,.3);flex:none}
.back svg{width:24px;height:24px}
.back:active{transform:scale(.96)}
.bar h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;margin-left:auto;flex:none}
.iconbtn svg{width:20px;height:20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;color:var(--mut);cursor:pointer;scroll-snap-align:start;transition:background .2s,color .2s,transform .15s}
.tab svg{width:18px;height:18px}
.tab.on{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:0 4px 12px rgba(90,18,41,.28)}
.tab:active{transform:scale(.96)}

/* ---------- Page ---------- */
main{padding-block:18px 64px}
.view{animation:viewin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 22px 22px;color:#fff;background:linear-gradient(140deg,#a52c58 0%,var(--wine) 55%,#2e0815 100%);box-shadow:0 18px 40px rgba(90,18,41,.35)}
.hero .staff{position:absolute;right:-30px;top:-10px;width:300px;opacity:.22;pointer-events:none}
.hero .staff path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.2s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero .glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(227,176,75,.45),transparent 65%);right:-80px;bottom:-120px;animation:float 7s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translate(-30px,-20px) scale(1.1)}}
.hello{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;position:relative}
.hero h2{font-size:clamp(34px,9vw,52px);font-weight:800;margin:6px 0 4px;position:relative}
.hero .tag-line{opacity:.85;position:relative;margin:0 0 18px}
.next{position:relative;display:grid;gap:10px;padding:16px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.next .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
.next h3{font-size:22px}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.kv span{font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14)}
.kv b{font-weight:700}

.aop{display:flex;align-items:center;gap:14px;margin-top:16px;padding:18px;border-radius:22px;text-decoration:none;color:var(--gold-ink);background:linear-gradient(120deg,#f6d27d,var(--gold) 55%,#c98f22);box-shadow:0 10px 26px rgba(201,143,34,.35);position:relative;overflow:hidden}
.aop::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s 1.2s ease-in-out infinite}
.aop .ic{width:52px;height:52px;border-radius:16px;background:rgba(43,26,0,.12);display:grid;place-items:center;flex:none}
.aop .ic svg{width:28px;height:28px}
.aop small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.aop strong{display:block;font-family:var(--display);font-size:21px;line-height:1.15}
.aop em{font-style:normal;font-size:14px;font-weight:600;opacity:.8}
.aop .arrow{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--gold-ink);color:var(--gold);display:grid;place-items:center;flex:none}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:639px){.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:0}}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:grid;gap:10px;align-content:start;min-height:132px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);text-align:left;cursor:pointer;opacity:0;animation:tilein .5s cubic-bezier(.2,.9,.2,1.1) forwards;transition:transform .15s}
.tile:active{transform:scale(.97)}
@keyframes tilein{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--wine2)}
@media (prefers-color-scheme:dark){.tile .ti{color:var(--gold)}}
.tile .ti svg{width:24px;height:24px}
.tile b{font-family:var(--display);font-size:19px;font-weight:800}
.tile span{font-size:13px;color:var(--mut);line-height:1.35}

.sec{margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{font-size:18px;margin-bottom:4px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.spread > div{min-width:0}
.pin{border-left:5px solid var(--gold)}
.lineup{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.lineup li{counter-increment:s;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.lineup li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.lineup li > div{min-width:0}
.lineup b{display:block;font-weight:700;overflow-wrap:anywhere}
.play{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--gold);color:var(--gold-ink)!important;font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.play.find{background:transparent;border:1.5px solid var(--line);color:var(--ink)!important}
.parth{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.parth h3{font-size:20px}
.sunhead{display:grid;gap:6px;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(140deg,#a52c58,var(--wine) 60%,#2e0815)}
.sunhead .kv span{background:rgba(255,255,255,.16)}
.hero-lu{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:2px;padding:0 16px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink);font-weight:800;cursor:pointer;width:max-content}
.lsong{display:grid;gap:6px;padding:12px;border-radius:14px;border:1px dashed var(--line);margin-bottom:8px}
.lsong .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:700}
.minis{display:flex;gap:4px}
.mini.sq{width:38px;padding:0}
.month{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:20px 0 10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:44px;padding:10px 16px;background:var(--wine);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn[disabled]{opacity:.6;cursor:default}
.btn.alt{background:var(--soft);color:var(--wine2)}
@media (prefers-color-scheme:dark){.btn.alt{color:var(--gold)}}
.btn.bad{background:var(--bad);color:#fff}
.mini{font:inherit;font-size:14px;font-weight:700;min-height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;flex:none}
.chip{font:inherit;font-size:14px;font-weight:600;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.tag{font-size:12px;background:var(--soft);color:var(--wine2);border-radius:8px;padding:3px 9px;font-weight:700}
@media (prefers-color-scheme:dark){.tag{color:var(--gold)}}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
label.ck{display:flex;gap:10px;align-items:center;font-weight:600}
label.ck input{width:22px;height:22px}
details.card summary{cursor:pointer;font-weight:700;list-style:none;font-size:17px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{color:var(--wine2);margin-bottom:8px}
.bar2{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5bd38f);transition:width .35s}
.chk{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-of-type{border:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;color:#fff;transition:background .2s}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on span{color:var(--mut);text-decoration:line-through}
.att{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:10px 16px;border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
.att b{font-size:13px;border-radius:8px;padding:4px 10px;background:var(--line);color:var(--mut)}
.att.p b{background:var(--ok);color:#fff}.att.l b{background:var(--gold);color:var(--gold-ink)}.att.a b{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;background:rgba(20,5,12,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .2s forwards}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:15px;font-weight:600;z-index:50;max-width:90%;text-align:center;animation:up .3s}
.empty{text-align:center;color:var(--mut);padding:26px 12px;border:1.5px dashed var(--line);border-radius:18px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.hint{color:var(--mut);font-size:13px;margin-top:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.tile,.sp-word span,.sp-sub{opacity:1}}
</style>
</head>

<script>
const SB = 'https://kuubzlcggvvmuldasmzu.supabase.co';
const KEY = 'sb_publishable_tILHIHGE0jnhrr7y26yBAw_aSCqZZke';
const AOP_URL = 'https://restkamp-aop-2026.vercel.app', AOP_START = '2026-12-29', AOP_UNTIL = '2026-12-31';
const CHOIR_NAME = 'RESTKAMP Choir', TAGLINE = 'Songs, schedules, rules and announcements, all in one place.';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => isoOf(new Date());

const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };

/* ---------- Icons ---------- */
const P = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  news:'<path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/>',

  back:'<path d="M15 5 8 12l7 7"/>',

const ic = (k, sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const TABS = [['home','Home'],['news','News'],['songs','Songs'],['rota','Schedule'],['rules','Rules'],['att','Attendance']];

async function api(path, opts = {}) {
  const r = await fetch(SB + '/rest/v1/' + path, {...opts, headers: {apikey: KEY, 'Content-Type': 'application/json', ...(opts.headers || {})}});
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error(m || ('Request failed (' + r.status + ')')); }

const rpc = (fn, args) => api('rpc/' + fn, {method: 'POST', body: JSON.stringify(args)});

function readLE(){
  if (!lineEdit) return;
  document.querySelectorAll('[data-lsec]').forEach(c => {

    c.querySelectorAll('[data-lf]').forEach(i => p[i.dataset.lf] = i.value);
    c.querySelectorAll('[data-lsong]').forEach(row => { const g = p.songs[+row.dataset.lsong]; row.querySelectorAll('[data-lg]').forEach(i => g[i.dataset.lg] = i.value); });
  });

async function lineAct(act, el){
  const r = items.rota.find(x => x.date === sunDate); if (!r) return;
  if (act === 'le_start') { lineEdit = {id: r.id, err: '', busy: false, sections: (r.lineup && r.lineup.length) ? JSON.parse(JSON.stringify(r.lineup)) : [{name:'Worship', lead:'', songs:[{t:'', yt:''}]}, {name:'Praise', lead:'', songs:[{t:'', yt:''}]}]}; render(); return; }
  if (!lineEdit) return;
  readLE();
  const c = el.closest('[data-lsec]'), p = c ? lineEdit.sections[+c.dataset.lsec] : null;
  const row = el.closest('[data-lsong]'), j = row ? +row.dataset.lsong : -1;
  if (act === 'le_cancel') lineEdit = null;
  if (act === 'le_addsong') p.songs.push({t:'', yt:''});
  if (act === 'le_rmsong') p.songs.splice(j, 1);
  if (act === 'le_up' && j > 0) [p.songs[j-1], p.songs[j]] = [p.songs[j], p.songs[j-1]];
  if (act === 'le_down' && j < p.songs.length - 1) [p.songs[j+1], p.songs[j]] = [p.songs[j], p.songs[j+1]];
  if (act === 'le_addsec') lineEdit.sections.push({name:'', lead:'', songs:[{t:'', yt:''}]});
  if (act === 'le_rmsec') lineEdit.sections.splice(+c.dataset.lsec, 1);
  if (act === 'le_save') {
    const secs = lineEdit.sections.map(p => ({name: p.name.trim(), lead: (p.lead || '').trim(), songs: p.songs.map(g => ({t: g.t.trim(), yt: g.yt.trim()})).filter(g => g.t || g.yt)})).filter(p => p.name || p.songs.length);
    if (secs.some(p => !p.name)) { lineEdit.err = 'Give every section a name, e.g. Worship or Praise.'; render(); return; }
    if (secs.some(p => p.songs.some(g => !g.t))) { lineEdit.err = 'Every song needs a title.'; render(); return; }
    if (secs.some(p => p.songs.some(g => g.yt && !/^https?:\/\//i.test(g.yt)))) { lineEdit.err = 'YouTube links must start with https://'; render(); return; }
    lineEdit.busy = true; lineEdit.err = ''; render();
    try {
      const data = {...r, lineup: secs}; delete data.id;
      await ed('editor_save_item', {p_id: r.id, p_kind: 'rota', p_data: data});
      lineEdit = null; await load(); toast('Lineup saved. Everyone can see it now.');
    } catch (err) { lineEdit.busy = false; lineEdit.err = "Couldn't save: " + err.message; render(); }
    return;
  }
  render();
}

    ${roster.members.map(m => `<button class="att ${rec[m.id] || ''}" data-act="att" data-id="${m.id}"><span>${esc(m.name)}</span><b>${lab[rec[m.id]] || 'Tap to mark'}</b></button>`).join('')}
    <p class="mut">Tap a name to cycle: present, late, absent.</p>
    ${dates.length ? `<div class="sec"><h2>Overall attendance</h2></div><div class="card">${roster.members.map(m => { const p = dates.filter(d => ['p','l'].includes((roster.attendance[d] || {})[m.id])).length; const pct = Math.round(p / dates.length * 100);
      return `<div class="spread" style="padding:6px 0"><span>${esc(m.name)} ${editBtn('member', m.id)}</span><b>${pct}%</b></div>`; }).join('')}
      <div class="mut">Across ${dates.length} rehearsal${dates.length > 1 ? 's' : ''}</div></div>` : ''}`
    : '<div class="empty" style="margin-top:12px">Add your choir members to start taking attendance.</div>'}`;
}

function formV(){
  const k = form.c, id = form.id, sch = SCH[k];
  let item = form.vals;
  if (!item) {
    if (id) item = k === 'song' ? songs.find(x => x.id === id) : k === 'member' ? roster.members.find(x => x.id === id) : items[k].find(x => x.id === id);
    else item = {type:'Worship', date: todayISO()};
  }
  item = item || {};
  const f = sch.fields.filter(x => !(x[0] === 'added_by' && id)).map(([n, lbl, t, opts, help]) => {
    const v = item[n] ?? '';
    const h = help ? `<div class="hint">${esc(help)}</div>` : '';
    if (t === 'textarea') return `<label for="f_${n}">${lbl}</label><textarea id="f_${n}" name="${n}">${esc(v)}</textarea>${h}`;
    if (t === 'check') return `<label class="ck"><input type="checkbox" name="${n}" ${v ? 'checked' : ''}> ${lbl}</label>`;
    if (t === 'select') return `<label for="f_${n}">${lbl}</label><select id="f_${n}" name="${n}">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    return `<label for="f_${n}">${lbl}</label><input id="f_${n}" name="${n}" type="${t === 'date' ? 'date' : 'text'}" value="${esc(v)}">${h}`;
  }).join('');
  const title = (id ? 'Edit ' : 'Add ') + sch.label;
  const canDelete = id && ['song','member', ...KINDS].includes(k);
  return `<div class="modal" data-act="closeform"><div class="sheet" id="frm"><h2>${title}</h2>${f}${form.err ? `<div class="err" role="alert">${esc(form.err)}</div>` : ''}
    <div class="row" style="margin-top:20px"><button class="btn" data-act="saveform" ${form.busy ? 'disabled' : ''}>${form.busy ? 'Saving...' : 'Save'}</button><button class="btn alt" data-act="closeform">Cancel</button>
    ${canDelete ? `<button class="btn bad" data-act="delitem" style="margin-left:auto" ${form.busy ? 'disabled' : ''}>${form.sure ? 'Tap again to delete' : 'Delete'}</button>` : ''}</div></div></div>`;
}

let lastTab = null;
function render(){
  readLE();
  const key = tab + sunDate, y = window.scrollY, changed = lastTab !== key; lastTab = key;
  const views = {sun:sunV, home:homeV, news:newsV, songs:songsV, rota:rotaV, rules:rulesV, att:attV};
  const body = loading ? '<div class="empty">Loading...</div>' : (loadErr ? `<div class="empty">${esc(loadErr)}</div>` : views[tab]());
  const barL = tab === 'home'
    ? `<a class="brand" href="#" data-act="tab" data-v="home"><span class="logo">${ic('note', 2.4).replace('currentColor', '#e3b04b')}</span>${esc(CHOIR_NAME)}</a>`
    : tab === 'sun' ? `<button class="back" data-act="tab" data-v="rota" aria-label="Back to schedule">${ic('back', 2.6)}Schedule</button><h1>${TITLES[tab]}</h1>`
    : `<button class="back" data-act="tab" data-v="home" aria-label="Back to home">${ic('back', 2.6)}Home</button><h1>${TITLES[tab]}</h1>`;
  $('#app').innerHTML = `<div class="top"><div class="wrap"><div class="bar">${barL}<button class="iconbtn" data-act="refresh" aria-label="Refresh">${ic('refresh')}</button></div>
    <nav class="tabs" aria-label="Sections">${TABS.map(([k, l]) => `<button class="tab ${tab === k || (tab === 'sun' && k === 'rota') ? 'on' : ''}" data-act="tab" data-v="${k}" ${tab === k ? 'aria-current="page"' : ''}>${ic(k)}${l}</button>`).join('')}</nav></div></div>
    <main class="wrap"><div class="${changed ? 'view' : ''}">${body}</div></main>
    ${form ? formV() : ''}${toastMsg ? `<div class="toast" role="status">${esc(toastMsg)}</div>` : ''}`;
  if (changed) { window.scrollTo(0, 0); const on = document.querySelector('.tab.on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'}); }
  else window.scrollTo(0, y);
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('Lineup copied'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Lineup copied'); } catch (_) { toast('Could not copy. Use the WhatsApp button instead.'); } ta.remove(); }
}

async function doSave(v){
  const {c, id} = form;
  if (c === 'song') {
    if (v.youtube_url && !/^https:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//i.test(v.youtube_url)) throw new Error('Use a full YouTube link starting with https://');
    const row = {title: v.title, type: v.type, musical_key: v.musical_key || null, notes: v.notes || null, youtube_url: v.youtube_url || null};
    if (id) await ed('editor_save_song', {p_id: id, p_title: row.title, p_type: row.type, p_key: v.musical_key || '', p_notes: v.notes || '', p_url: v.youtube_url || ''});
    else { row.added_by = v.added_by || null; await api('songs', {method: 'POST', headers: {Prefer: 'return=minimal'}, body: JSON.stringify(row)}); }
    await load(); return id ? 'Song updated' : 'Song added';
  }
  if (c === 'members') {
    for (const n of v.names.split('\n').map(s => s.trim()).filter(Boolean)) await ed('editor_save_member', {p_id: null, p_name: n});
    await loadRoster(); return 'Members added';
  }
  if (c === 'member') { await ed('editor_save_member', {p_id: id, p_name: v.name}); await loadRoster(); return 'Saved'; }
  if (c === 'rotabulk') {
    const rows = [], bad = [];
    v.lines.split('\n').map(s => s.trim()).filter(Boolean).forEach(l => {
      const p = l.split('|').map(x => x.trim());
      if (/^\d{4}-\d{2}-\d{2}$/.test(p[0] || '')) rows.push({date: p[0], service: p[1] || 'Service', lead: p[2] || '', uniform: p[3] || '', notes: p[4] || ''}); else bad.push(l);
    });
    if (bad.length) throw new Error('Check these lines. The date must look like 2026-11-01: ' + bad.slice(0, 3).join(' / '));
    for (const r of rows) await ed('editor_save_item', {p_id: null, p_kind: 'rota', p_data: r});
    await load(); return rows.length + ' dates added';
  }
  if (c === 'rota' && id) { const old = items.rota.find(x => x.id === id); if (old && old.lineup) v.lineup = old.lineup; }
  await ed('editor_save_item', {p_id: id || null, p_kind: c, p_data: v});
  await load(); return 'Saved';
}

async function saveForm(){
  const v = {};
  document.querySelectorAll('#frm [name]').forEach(el => v[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim());
  form.vals = v; form.err = '';
  if ((SCH[form.c].req || []).some(k => !v[k])) { form.err = 'Please fill in the fields marked *.'; render(); return; }
  form.busy = true; render();
  try { const msg = await doSave(v); form = null; toastMsg = msg; clearTimeout(toast.t); toast.t = setTimeout(() => { toastMsg = ''; render(); }, 2800); }
  catch (e) { form.busy = false; form.err = e.message; }
  render();
}

async function delItem(){
  if (!form.sure) { form.sure = true; render(); return; }
  const {c, id} = form; form.busy = true; render();
  try {
    if (c === 'song') await ed('editor_delete_song', {p_id: id});
    else if (c === 'member') await ed('editor_delete_member', {p_id: id});
    else await ed('editor_delete_item', {p_id: id});
    form = null; if (c === 'member') await loadRoster(); else await load();
    toast('Deleted');
  } catch (e) { form.busy = false; form.sure = false; form.err = e.message; render(); }
}

function queueSave(day){
  attStatus = 'Saving...'; clearTimeout(timers[day]);
  timers[day] = setTimeout(async () => {
    try { await ed('editor_set_attendance', {p_day: day, p_marks: roster.attendance[day] || {}}); attStatus = 'Saved'; }
    catch (e) { attStatus = 'Not saved: ' + e.message; }
    render();
  }, 500);
}

function goTab(v){ fresh = false; if (v === tab && v !== 'sun') { window.scrollTo({top:0, behavior:'smooth'}); return; } location.hash = v === 'home' ? '' : v; if (v === 'home') onHash(); }
function onHash(){ lineEdit = null; tab = tabFromHash(); if (tab === 'att' && !roster) loadRoster(); form = null; render(); }
window.addEventListener('hashchange', onHash);

const A = {
  le_start: (d, el) => { lineAct('le_start', el); return 'skip'; },
  tab: d => { goTab(d.v); return 'skip'; },
  refresh: () => { loading = true; render(); load(); if (roster) loadRoster(); return 'skip'; },
  add: d => { form = {c: d.c, id: null}; },
  edit: d => { form = {c: d.c, id: d.id}; },
  closeform: () => { if (form && form.busy) return 'skip'; form = null; },
  saveform: () => { saveForm(); return 'skip'; },
  delitem: () => { delItem(); return 'skip'; },
  cat: d => { cat = d.v; },
  pick: d => { picked = picked.includes(d.id) ? picked.filter(x => x !== d.id) : [...picked, d.id]; },
  clearlineup: () => { picked = []; },
  copy: () => { copyText(lineupText()); return 'skip'; },
  check: d => { checked[d.id] = !checked[d.id]; },
  resetcheck: () => { checked = {}; },
  att: d => {
    const r = roster.attendance[attDate] = roster.attendance[attDate] || {};
    const next = {undefined:'p', p:'l', l:'a', a:undefined}[r[d.id]];
    if (next) r[d.id] = next; else delete r[d.id];
    if (!Object.keys(r).length) delete roster.attendance[attDate];
    queueSave(attDate);
  },
  allpresent: () => {
    const r = roster.attendance[attDate] = {};
    roster.members.forEach(m => r[m.id] = 'p'); queueSave(attDate);
  }
};

const app = $('#app');
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.classList.contains('modal') && e.target !== t) return;
  if (t.tagName === 'A' && t.dataset.act !== 'tab') return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.act.startsWith('le_')) { lineAct(t.dataset.act, t); return; }
  if (A[t.dataset.act]?.(t.dataset) !== 'skip') render();
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('chk')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && form && e.target.tagName === 'INPUT') { e.preventDefault(); saveForm(); }
});
app.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; $('#slist').innerHTML = songListV(); } });
app.addEventListener('change', e => {
  if (e.target.matches('[data-lpick]') && lineEdit && e.target.value) { readLE(); const s = songs.find(x => x.id === e.target.value); const p = lineEdit.sections[+e.target.closest('[data-lsec]').dataset.lsec]; if (s && p) { const blank = p.songs.findIndex(g => !g.t && !g.yt); const g = {t: s.title, yt: s.youtube_url || ''}; if (blank >= 0) p.songs[blank] = g; else p.songs.push(g); } render(); return; } if (e.target.id === 'ad' && e.target.value) { attDate = e.target.value; render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 90000);

/* ---------- Splash ---------- */
(function splash(){
  const sp = $('#splash'), word = sp.querySelector('.sp-word');
  word.innerHTML = [...word.textContent].map((ch, i) => `<span style="animation-delay:${.15 + i * .07}s">${ch}</span>`).join('');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const started = Date.now();
  const finish = () => {
    const wait = Math.max(0, (reduce ? 200 : 1900) - (Date.now() - started));
    setTimeout(() => {
      if (!reduce) { const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 800); }
      sp.classList.add('go'); setTimeout(() => sp.remove(), 800);
    }, wait);
  };
  finish.once = false;
  window.__splashDone = () => { if (!finish.once) { finish.once = true; finish(); } };
  setTimeout(window.__splashDone, 4000);
})();

render();
if (tab === 'att') loadRoster();
load().then(() => window.__splashDone());
</script>
</body>
</html>
